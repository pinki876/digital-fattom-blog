<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEO Master Pro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0d1117;color:#e6edf3;padding:15px;line-height:1.6}
h1{font-size:20px;margin-bottom:5px;color:#58a6ff}
.sub{font-size:12px;color:#8b98a9;margin-bottom:15px}
.panel{background:#161b22;border:1px solid #2a3140;border-radius:12px;padding:14px;margin-bottom:14px}
label{display:block;font-size:12px;color:#8b98a9;margin:12px 0 6px;font-weight:600;text-transform:uppercase}
textarea,input{width:100%;background:#0d1117;border:1px solid #2a3140;border-radius:8px;color:#e6edf3;padding:10px;font-size:14px;font-family:inherit;outline:none}
textarea{min-height:180px;resize:vertical}
textarea:focus,input:focus{border-color:#58a6ff}
button{background:#238636;border:1px solid #2ea043;color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin:10px 5px 0 0;font-family:inherit}
button.alt{background:#1c2230;border-color:#2a3140}
button.small{padding:5px 10px;font-size:12px;margin-top:5px}
.score{text-align:center;padding:20px;border-radius:12px;background:#161b22;border:1px solid #2a3140;margin-bottom:14px}
.score .num{font-size:52px;font-weight:800;line-height:1}
.score .lbl{font-size:13px;color:#8b98a9;margin-top:5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:#1c2230;border-radius:8px;padding:8px;text-align:center}
.stat b{display:block;font-size:16px;color:#58a6ff}
.stat span{font-size:10px;color:#8b98a9;text-transform:uppercase}
.check{display:flex;gap:8px;padding:8px;border-radius:8px;background:#1c2230;margin-bottom:6px;font-size:13px;border-left:3px solid}
.check.pass{border-color:#3fb950}
.check.warn{border-color:#d29922}
.check.fail{border-color:#f85149}
.check .ic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none;color:#0d1117}
.check.pass .ic{background:#3fb950}
.check.warn .ic{background:#d29922}
.check.fail .ic{background:#f85149}
.check b{display:block;font-size:12px}
.check em{font-style:normal;color:#8b98a9;font-size:11.5px}
pre{background:#0d1117;border:1px solid #2a3140;border-radius:8px;padding:10px;font-size:11px;white-space:pre-wrap;word-break:break-word;color:#a5d6ff;max-height:200px;overflow:auto;margin:6px 0}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.row span{font-size:11px;color:#8b98a9;text-transform:uppercase;font-weight:600}
.chip{display:inline-block;background:#1c2230;border:1px solid #2a3140;border-radius:16px;padding:3px 10px;font-size:12px;margin:3px;cursor:pointer}
.chip:hover{border-color:#58a6ff;color:#58a6ff}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#238636;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;transition:.3s;pointer-events:none}
#toast.show{opacity:1}
</style>
</head>
<body>
<h1>SEO Master Pro</h1>
<div class="sub">English + Roman Urdu — 100% apna tool</div>

<div class="panel">
  <label>Article Paste Karein (sirf text, HTML nahi)</label>
  <textarea id="article" placeholder="Yahan apna article paste karein..."></textarea>
  <label>Primary Keyword (English)</label>
  <input type="text" id="kwEn" placeholder="e.g. best seo tips">
  <label>Secondary Keyword (Roman Urdu) — optional</label>
  <input type="text" id="kwUr" placeholder="e.g. seo tips urdu mein">
  <button onclick="analyze()">Analyze Karo</button>
  <button class="alt" onclick="demo()">Demo</button>
  <button class="alt" onclick="clearAll()">Clear</button>
</div>

<div id="out"></div>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}

function slug(s){return s.toLowerCase().trim().replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-').slice(0,70);}

function analyze(){
  const raw=$('article').value.trim();
  const kwEn=$('kwEn').value.trim().toLowerCase();
  const kwUr=$('kwUr').value.trim().toLowerCase();
  if(!raw){toast('Pehle article paste karein');return;}
  if(!kwEn&&!kwUr){toast('Kam az kam ek keyword likhein');return;}

  const text=raw.replace(/\s+/g,' ').trim();
  const words=text.split(' ');
  const wc=words.length;
  const sents=(text.match(/[^.!?]+[.!?]+/g)||[text]).length;
  const paras=raw.split(/\n\s*\n/).filter(p=>p.trim()).length||1;
  const avgSent=wc/Math.max(sents,1);
  const avgPara=wc/paras;

  const kwCount=(kw)=>{if(!kw)return 0;return (text.toLowerCase().match(new RegExp('\\b'+kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','g'))||[]).length;};
  const cEn=kwCount(kwEn), cUr=kwCount(kwUr);
  const denEn=wc?(cEn*Math.max(kwEn.split(' ').length,1)/wc*100):0;
  const denUr=wc?(cUr*Math.max(kwUr.split(' ').length,1)/wc*100):0;
  const first100=words.slice(0,100).join(' ').toLowerCase();
  const title=words.slice(0,12).join(' ');

  const checks=[];
  const add=(n,s,m,w=1)=>checks.push({n,s,m,w});

  add('Word Count',wc>=800?'pass':wc>=300?'warn':'fail',wc+' words');
  add('Title Length',(title.length>=30&&title.length<=60)?'pass':'warn',title.length+' chars');
  if(kwEn){
    add('KW (EN) in First 100',first100.includes(kwEn)?'pass':'fail',first100.includes(kwEn)?'Haan':'Nahi');
    add('KW (EN) Density',(denEn>=0.5&&denEn<=2.5)?'pass':denEn>0?'warn':'fail',denEn.toFixed(2)+'% ('+cEn+'x)');
  }
  if(kwUr){
    add('KW (Roman Urdu) Count',cUr>0?'pass':'warn',cUr+' baar');
    add('KW (Roman Urdu) Density',(denUr>=0.3&&denUr<=3)?'pass':'warn',denUr.toFixed(2)+'%');
  }
  add('Sentence Length',avgSent<=20?'pass':avgSent<=25?'warn':'fail',avgSent.toFixed(1)+' words/sentence');
  add('Paragraph Length',avgPara<=120?'pass':avgPara<=180?'warn':'fail',Math.round(avgPara)+' words/para');

  const totalW=checks.reduce((a,c)=>a+c.w,0);
  const gotW=checks.reduce((a,c)=>a+(c.s==='pass'?c.w:c.s==='warn'?c.w*0.5:0),0);
  const score=Math.round(gotW/totalW*100);

  const slugTxt=slug(kwEn||title);
  const desc=(kwEn?kwEn.charAt(0).toUpperCase()+kwEn.slice(1)+' — ':'')+text.slice(0,140)+'...';
  const titleTag='<title>'+esc(title)+'</title>';
  const metaTag='<meta name="description" content="'+esc(desc.slice(0,158))+'">';

  const color=score>=80?'#3fb950':score>=60?'#d29922':'#f85149';
  const lbl=score>=80?'Zabardast!':score>=60?'Theek hai':'Improve karein';
  const icons={pass:'✓',warn:'!',fail:'✕'};

  $('out').innerHTML=`
    <div class="score">
      <div class="num" style="color:${color}">${score}</div>
      <div class="lbl">/100 — ${lbl}</div>
      <div class="stats">
        <div class="stat"><b>${wc}</b><span>Words</span></div>
        <div class="stat"><b>${sents}</b><span>Sentences</span></div>
        <div class="stat"><b>${paras}</b><span>Paragraphs</span></div>
      </div>
    </div>
    <div class="panel">
      <label>SEO Checks</label>
      ${checks.map(c=>`<div class="check ${c.s}"><div class="ic">${icons[c.s]}</div><div><b>${esc(c.n)}</b><em>${esc(c.m)}</em></div></div>`).join('')}
    </div>
    <div class="panel">
      <label>URL Slug</label>
      <pre id="c1">${esc(slugTxt)}</pre>
      <button class="small" onclick="cp('c1')">Copy</button>
      <label>Title Tag</label>
      <pre id="c2">${esc(titleTag)}</pre>
      <button class="small" onclick="cp('c2')">Copy</button>
      <label>Meta Description</label>
      <pre id="c3">${esc(metaTag)}</pre>
      <button class="small" onclick="cp('c3')">Copy</button>
    </div>
  `;
}

function cp(id){navigator.clipboard.writeText($(id).textContent).then(()=>toast('Copy ho gaya'));}

function clearAll(){$('article').value='';$('kwEn').value='';$('kwUr').value='';$('out').innerHTML='';}

function demo(){
  $('kwEn').value='best seo tips';
  $('kwUr').value='seo tips urdu mein';
  $('article').value=`Best SEO Tips for Beginners

SEO seekhna aaj ke daur mein bohat zaroori hai. Agar aap chahte hain ke aap ka blog Google par rank kare, to basic SEO tips follow karein. Best seo tips for beginners samajhna asaan hai.

What is SEO

SEO ya Search Engine Optimization ek process hai jis se aap apni website ki visibility search results mein barhaate hain. Ye organic traffic laane ka sasta tareeqa hai.

On-Page SEO Tips

Title tag mein apna keyword rakhein. Meta description likhein. Headings ka sahi istemal karein. Images ko alt text dein. Internal links banayein.

Off-Page SEO Tips

Backlinks banayein. Guest posting karein. Social media par share karein.

Common Mistakes

Keyword stuffing na karein. Duplicate content na likhein. Slow website na rakhein.`;
  analyze();
}
</script>
</body>
</html>
